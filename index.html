        // Logica comune a giocatore umano e bot
        function resolveHypothesis(proposer, suspectId, weaponId, room) {
            // Prima l'arma, poi il sospettato, così il sospettato evita la casella dell'arma
            const targetWeapon = WEAPONS.find(w => w.id === weaponId);
            if (targetWeapon && targetWeapon.currentRoom !== room.id) {
                assignWeaponToRoom(targetWeapon, room.id);
            }

            const targetPlayer = gameState.players.find(p => p.character === suspectId);
            if (targetPlayer) {
                const alreadyHere = getCurrentRoom(targetPlayer.x, targetPlayer.y) === room;
                if (!alreadyHere) {
                    const freeTile = findFreeRoomTile(room);
                    targetPlayer.x = freeTile.x;
                    targetPlayer.y = freeTile.y;
                    // Chi viene spostato da un altro può ipotizzare all'inizio del proprio turno senza muoversi
                    if (targetPlayer !== proposer) targetPlayer.canSuggestHere = true;
                }
            }

            drawBoard();
            logEvent(`❓ **${proposer.name}** ipotizza: **${suspectId}** con **${weaponId}** in **${room.id}**.`);

            // Smentita: si procede in ordine di turno; i giocatori eliminati smentiscono ancora
            const cards = [suspectId, weaponId, room.id];
            const start = gameState.players.indexOf(proposer);
            const passed = [];
            let disprover = null;
            let cardShown = null;

            for (let i = 1; i < gameState.players.length; i++) {
                const other = gameState.players[(start + i) % gameState.players.length];
                const match = other.cards.filter(c => cards.includes(c));
                if (match.length > 0) {
                    disprover = other;
                    cardShown = pickRandom(match);
                    break;
                }
                passed.push(other);
            }

            passed.forEach(p => logEvent(`🚫 **${p.name}** non può smentire.`));

            if (disprover) {
                const iAmDisprover = !disprover.isBot && gameState.myPlayer && disprover.character === gameState.myPlayer.character;
                logEvent(`🔍 **${disprover.name}** ha mostrato una carta a ${proposer.name}.` + (iAmDisprover ? ` (hai mostrato: "${cardShown}")` : ''));
                if (!proposer.isBot) {
                    markNotebook(cardShown, "❌");
                    alert(`${disprover.name} ti mostra la carta: "${cardShown}"`);
                }
            } else {
                logEvent(`❌ Nessun giocatore ha potuto smentire l'ipotesi!`);
            }

            // Tutti i bot vedono chi ha ipotizzato, chi non ha smentito e chi ha mostrato una carta
            gameState.players.forEach(b => {
                if (b.isBot && b.kb) observeHypothesis(b, proposer, cards, passed, disprover, cardShown);
            });

            // L'ipotesi conclude la fase di movimento del turno
            proposer.canSuggestHere = false;
            if (gameState.players[gameState.currentTurnIndex] === proposer) {
                gameState.hasMoved = true;
                gameState.reachableCells = [];
                if (!proposer.isBot) {
                    document.getElementById('btn-roll-dice').disabled = true;
                    document.getElementById('btn-secret-passage').classList.add('hidden');
                }
            }
            return { passed, disprover, cardShown };
        }

        // ---------- Conoscenza e deduzione dei bot ----------
        // kb.held[carta]    = personaggio che la possiede (certo)
        // kb.noHold[pers]   = carte che quel personaggio certamente non possiede
        // kb.constraints    = { holder, cards } : holder possiede almeno una di queste carte
        // kb.handSize[pers] = quante carte ha in mano (nel gioco reale è noto a tutti)
        // kb.asked          = ipotesi già formulate dal bot (per non ripeterle)
        function allCardList() {
            return [...CARDS_BY_CAT.suspect, ...CARDS_BY_CAT.weapon, ...CARDS_BY_CAT.room];
        }

        function initBotKnowledge(bot) {
            const kb = { held: {}, noHold: {}, constraints: [], handSize: {}, asked: new Set() };
            gameState.players.forEach(q => {
                kb.noHold[q.character] = new Set();
                kb.handSize[q.character] = q.cards.length;
            });
            allCardList().forEach(c => {
                if (bot.cards.includes(c)) kb.held[c] = bot.character;
                else kb.noHold[bot.character].add(c);
            });
            bot.kb = kb;
            propagateKnowledge(bot);
        }

        function observeHypothesis(bot, proposer, cards, passed, disprover, cardShown) {
            const kb = bot.kb;
            passed.forEach(p => {
                if (p !== bot) cards.forEach(c => kb.noHold[p.character].add(c));
            });
            if (disprover && disprover !== bot) {
                if (proposer === bot) kb.held[cardShown] = disprover.character;
                else kb.constraints.push({ holder: disprover.character, cards: [...cards] });
            }
            propagateKnowledge(bot);
        }

        function propagateKnowledge(bot) {
            const kb = bot.kb;
            const all = allCardList();
            let changed = true;
            while (changed) {
                changed = false;

                // 1. Una carta posseduta da qualcuno non è in mano a nessun altro
                all.forEach(c => {
                    const h = kb.held[c];
                    if (!h) return;
                    gameState.players.forEach(p => {
                        if (p.character !== h && !kb.noHold[p.character].has(c)) {
                            kb.noHold[p.character].add(c);
                            changed = true;
                        }
                    });
                });

                // 2. Vincoli "ha almeno una di queste carte"
                kb.constraints = kb.constraints.filter(con => {
                    const remaining = con.cards.filter(c =>
                        !(kb.held[c] && kb.held[c] !== con.holder) && !kb.noHold[con.holder].has(c));
                    if (remaining.some(c => kb.held[c] === con.holder)) return false; // già soddisfatto
                    if (remaining.length === 1) {
                        kb.held[remaining[0]] = con.holder;
                        changed = true;
                        return false;
                    }
                    con.cards = remaining;
                    return remaining.length > 0;
                });

                // 3. Numero di carte in mano a ciascun giocatore
                gameState.players.forEach(p => {
                    const q = p.character;
                    const size = kb.handSize[q];
                    const heldBy = all.filter(c => kb.held[c] === q);
                    if (heldBy.length >= size) {
                        // mano completa: non ha nessun'altra carta
                        all.forEach(c => {
                            if (kb.held[c] !== q && !kb.noHold[q].has(c)) {
                                kb.noHold[q].add(c);
                                changed = true;
                            }
                        });
                    } else {
                        // le carte che può ancora avere sono tante quante ne servono: le ha tutte
                        const possible = all.filter(c => kb.held[c] === q || (!kb.held[c] && !kb.noHold[q].has(c)));
                        if (possible.length === size) {
                            possible.forEach(c => {
                                if (kb.held[c] !== q) { kb.held[c] = q; changed = true; }
                            });
                        }
                    }
                });
            }
        }

        function botCandidates(bot, category) {
            return CARDS_BY_CAT[category].filter(c => !bot.kb.held[c]);
        }

        // Restituisce { suspect, weapon, room } per le categorie di cui il bot è certo
        function deduceEnvelope(bot) {
            const result = {};
            ['suspect', 'weapon', 'room'].forEach(cat => {
                const cands = botCandidates(bot, cat);
                const nobodyHolds = cands.filter(c => gameState.players.every(p => bot.kb.noHold[p.character].has(c)));
                if (cands.length === 1) result[cat] = cands[0];
                else if (nobodyHolds.length === 1) result[cat] = nobodyHolds[0];
            });
            return result;
        }

        // Punteggio di una carta candidata da inserire in un'ipotesi: più alto = più utile da chiedere.
        // Le carte che meno giocatori possono ancora avere in mano sono le più probabili nella busta:
        // se nessuno le smentisce, il bot scopre la soluzione. (Misurato su 400 partite simulate:
        // è la scelta che chiude la partita più in fretta; pesare anche i vincoli aperti peggiora.)
        function botCardScore(bot, card) {
            const kb = bot.kb;
            const others = gameState.players.filter(p => p.character !== bot.character);
            const possibleHolders = others.filter(p => !kb.noHold[p.character].has(card)).length;
            const likelyEnvelope = 1 - possibleHolders / others.length;
            return likelyEnvelope + Math.random() * 0.4;
        }

        // Sceglie la carta (sospettato o arma) da citare nell'ipotesi
        function botPickCard(bot, category) {
            const cands = botCandidates(bot, category);
            if (cands.length === 1) {
                // categoria già risolta: si cita una carta propria, così non si rivela la certezza
                const own = bot.cards.filter(c => CARDS_BY_CAT[category].includes(c));
                return own.length ? pickRandom(own) : cands[0];
            }
            let best = cands[0], bestScore = -Infinity;
            cands.forEach(c => {
                const sc = botCardScore(bot, c);
                if (sc > bestScore) { bestScore = sc; best = c; }
            });
            return best;
        }

        // ---------- Accusa ----------
        function openAccusationModal() { document.getElementById('modal-accusation').classList.remove('hidden'); }

        function submitAccusation() {
            const suspect = document.getElementById('acc-suspect').value;
            const weapon = document.getElementById('acc-weapon').value;
            const room = document.getElementById('acc-room').value;
            const currPlayer = gameState.players[gameState.currentTurnIndex];

            closeModal('modal-accusation');

            const won = resolveAccusation(currPlayer, suspect, weapon, room);
            if (!won) endTurn();
        }

        // Restituisce true se l'accusa è corretta (partita finita)
        function resolveAccusation(player, suspect, weapon, room) {
            const sol = gameState.solution;
            logEvent(`⚖️ **${player.name}** accusa: **${suspect}** con **${weapon}** in **${room}**.`);

            if (suspect === sol.suspect && weapon === sol.weapon && room === sol.room) {
                gameState.gameOver = true;
                clearTimeout(botTimer);
                botTimer = null;
                gameState.reachableCells = [];
                disableAllActions();
                logEvent(`🏆 **${player.name} HA VINTO!** Soluzione: ${sol.suspect}, ${sol.weapon}, ${sol.room}.`);
                alert(`🎉 ACCUSA CORRETTA! ${player.name} ha risolto il mistero!\nLa soluzione era: ${sol.suspect} con ${sol.weapon} in ${sol.room}.`);
                return true;
            }

            player.active = false;
            player.canSuggestHere = false;
            logEvent(`💀 **${player.name}** ha sbagliato accusa ed è eliminato: potrà solo smentire le ipotesi altrui.`);
            if (!player.isBot) {
                alert(`❌ ACCUSA ERRATA! ${player.name} è eliminato: potrai solo smentire le ipotesi degli altri giocatori. La partita continua.`);
            }
            updateLegend();

            if (!gameState.players.some(p => p.active)) {
                gameState.gameOver = true;
                clearTimeout(botTimer);
                botTimer = null;
                disableAllActions();
                logEvent(`🕯️ Tutti i detective sono stati eliminati: il caso resta irrisolto. Soluzione: ${sol.suspect}, ${sol.weapon}, ${sol.room}.`);
                alert(`Tutti i detective sono stati eliminati. La soluzione era: ${sol.suspect} con ${sol.weapon} in ${sol.room}.`);
            }
            return false;
        }

        // ---------- Turni ----------
        function endTurn() {
            if (gameState.gameOver || !gameState.players.length) return;
            if (!gameState.players.some(p => p.active)) return;

            gameState.players[gameState.currentTurnIndex].canSuggestHere = false;
            gameState.hasMoved = false;
            gameState.reachableCells = [];
            document.getElementById('dice-result').innerText = "-";
            document.getElementById('btn-secret-passage').classList.add('hidden');

            do {
                gameState.currentTurnIndex = (gameState.currentTurnIndex + 1) % gameState.players.length;
            } while (!gameState.players[gameState.currentTurnIndex].active);

            updateTurnUI();
            drawBoard();

            const currPlayer = gameState.players[gameState.currentTurnIndex];
            if (currPlayer.isBot) botDelay(playBotTurn, 800);
        }

        // Distanza (in caselle di corridoio) dalle porte delle stanze indicate, ignorando le pedine
        function roomDistanceMap(targetRooms) {
            const dist = new Map();
            const queue = [];
            targetRooms.forEach(r => {
                DOORS.filter(d => d.room === r.id).forEach(d => {
                    dist.set(`${d.x},${d.y}`, 0);
                    queue.push({ x: d.x, y: d.y, dist: 0 });
                });
            });
            const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            while (queue.length > 0) {
                const c = queue.shift();
                if (c.dist > 0 && getCurrentRoom(c.x, c.y)) continue; // le stanze non si attraversano
                for (const d of dirs) {
                    const nx = c.x + d.x, ny = c.y + d.y;
                    if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                    const key = `${nx},${ny}`;
                    if (!dist.has(key) && isValidTile(nx, ny)) {
                        dist.set(key, c.dist + 1);
                        queue.push({ x: nx, y: ny, dist: c.dist + 1 });
                    }
                }
            }
            return dist;
        }

        function botChooseDestination(bot, reachable) {
            if (reachable.length === 0) return null;
            const targetIds = new Set(botCandidates(bot, 'room'));
            const targetRooms = ROOMS.filter(r => targetIds.has(r.id));

            const inTarget = reachable.filter(c => {
                const r = getCurrentRoom(c.x, c.y);
                return r && targetIds.has(r.id);
            });
            if (inTarget.length > 0) return pickRandom(inTarget);

            const distMap = roomDistanceMap(targetRooms);
            let pool = reachable.filter(c => !getCurrentRoom(c.x, c.y)); // evita stanze inutili
            if (pool.length === 0) pool = reachable;

            let best = Infinity;
            let bestCells = [];
            pool.forEach(c => {
                const d = distMap.has(`${c.x},${c.y}`) ? distMap.get(`${c.x},${c.y}`) : Infinity;
                if (d < best) { best = d; bestCells = [c]; }
                else if (d === best) bestCells.push(c);
            });
            return pickRandom(bestCells);
        }

        // Se il bot ha ricavato la soluzione, accusa; restituisce true se ha accusato
        function botAccuseIfSolved(bot) {
            const env = deduceEnvelope(bot);
            if (env.suspect && env.weapon && env.room) {
                resolveAccusation(bot, env.suspect, env.weapon, env.room);
                if (!gameState.gameOver) botDelay(endTurn, 800);
                return true;
            }
            return false;
        }

        function botHypothesize(bot, room) {
            // Evita di ripetere un'ipotesi già fatta nella stessa stanza
            let suspect, weapon, key;
            for (let attempt = 0; attempt < 8; attempt++) {
                suspect = botPickCard(bot, 'suspect');
                weapon = botPickCard(bot, 'weapon');
                key = `${suspect}|${weapon}|${room.id}`;
                if (!bot.kb.asked.has(key)) break;
            }
            bot.kb.asked.add(key);
            resolveHypothesis(bot, suspect, weapon, room);
            // Il messaggio resta a video finché il detective preme SPAZIO (o dopo 10 s); poi il turno prosegue
            showBotHypothesis(bot, suspect, weapon, room, () => {
                botDelay(() => {
                    if (gameState.gameOver) return;
                    if (!botAccuseIfSolved(bot)) botDelay(endTurn, 500);
                }, 300);
            });
        }

        function playBotTurn() {
            if (gameState.gameOver || !gameState.players.length) return;
            const bot = gameState.players[gameState.currentTurnIndex];
            if (!bot || !bot.isBot || !bot.active) return;

            if (botAccuseIfSolved(bot)) return;

            const roomNow = getCurrentRoom(bot.x, bot.y);
            const isUsefulRoom = r => r && botCandidates(bot, 'room').includes(r.id);

            // Spostato da un'ipotesi altrui in una stanza utile: ipotizza senza muoversi
            if (bot.canSuggestHere && isUsefulRoom(roomNow)) {
                botDelay(() => botHypothesize(bot, roomNow), 400);
                return;
            }

            // Passaggio segreto verso una stanza ancora utile
            if (roomNow && roomNow.passage) {
                const dest = ROOMS.find(r => r.id === roomNow.passage);
                if (isUsefulRoom(dest)) {
                    const t = findFreeRoomTile(dest);
                    bot.x = t.x; bot.y = t.y;
                    bot.canSuggestHere = false;
                    logEvent(`${bot.name} usa il passaggio segreto per **${dest.id}**!`);
                    drawBoard();
                    botDelay(() => botHypothesize(bot, dest), 800);
                    return;
                }
            }

            // Tiro dei dadi e avvicinamento alla stanza utile più vicina
            const dice = (Math.floor(Math.random() * 6) + 1) + (Math.floor(Math.random() * 6) + 1);
            const target = botChooseDestination(bot, getReachableCells(bot.x, bot.y, dice));
            if (!target && roomNow && roomNow.passage) {
                // Nessuna casella raggiungibile: il passaggio segreto evita di restare bloccati
                const dest = ROOMS.find(r => r.id === roomNow.passage);
                const t = findFreeRoomTile(dest);
                bot.x = t.x; bot.y = t.y;
                bot.canSuggestHere = false;
                logEvent(`${bot.name} usa il passaggio segreto per **${dest.id}**!`);
                drawBoard();
                if (isUsefulRoom(dest)) botDelay(() => botHypothesize(bot, dest), 800);
                else botDelay(endTurn, 800);
                return;
            }

            if (target) {
                bot.x = target.x; bot.y = target.y;
                bot.canSuggestHere = false;
                drawBoard();
            }

            const roomAfter = getCurrentRoom(bot.x, bot.y);
            if (target && roomAfter) logEvent(`${bot.name} è entrato nella stanza **${roomAfter.id}**.`);
            if (target && isUsefulRoom(roomAfter)) botDelay(() => botHypothesize(bot, roomAfter), 800);
            else botDelay(endTurn, 800);
        }

        function updateTurnUI() {
            const curr = gameState.players[gameState.currentTurnIndex];
            document.getElementById('display-current-turn').innerText = `${curr.character}`;
            const isMyTurn = !curr.isBot && curr.character === gameState.myPlayer.character;

            const currentRoom = getCurrentRoom(curr.x, curr.y);
            const canSuggestNow = isMyTurn && curr.canSuggestHere && !gameState.hasMoved && currentRoom;

            document.getElementById('btn-roll-dice').disabled = !isMyTurn || gameState.hasMoved;
            document.getElementById('btn-hypothesis').disabled = !canSuggestNow;
            document.getElementById('btn-accusation').disabled = !isMyTurn;
            document.getElementById('btn-end-turn').disabled = !isMyTurn;

            if (canSuggestNow) {
                logEvent(`ℹ️ Sei stato spostato in **${currentRoom.id}**: puoi formulare un'ipotesi senza muoverti.`);
            }

            const btnP = document.getElementById('btn-secret-passage');
            if (isMyTurn && !gameState.hasMoved && currentRoom && currentRoom.passage) {
                btnP.classList.remove('hidden');
                btnP.innerText = `🌀 Passaggio per ${currentRoom.passage}`;
            } else {
                btnP.classList.add('hidden');
            }
        }

        function checkTurnActions() {
            const curr = gameState.players[gameState.currentTurnIndex];
            if (!curr.isBot && gameState.hasMoved) {
                document.getElementById('btn-end-turn').disabled = false;
            }
        }

        function initNotebook() {
            const tabSuspects = document.getElementById('notebook-tab-suspects');
            const tabWeapons = document.getElementById('notebook-tab-weapons');
            const tabRooms = document.getElementById('notebook-tab-rooms');

            tabSuspects.innerHTML = "";
            tabWeapons.innerHTML = "";
            tabRooms.innerHTML = "";

            SUSPECTS.forEach(s => {
                const item = `${s.id}`;
                const cleanKey = s.id;
                gameState.notebook[cleanKey] = "❓";
                tabSuspects.innerHTML += createNotebookRow(item, cleanKey);
            });

            WEAPONS.forEach(w => {
                gameState.notebook[w.id] = "❓";
                tabWeapons.innerHTML += createNotebookRow(w.id, w.id);
            });

            ROOMS.forEach(r => {
                gameState.notebook[r.id] = "❓";
                tabRooms.innerHTML += createNotebookRow(r.id, r.id);
            });
        }

        function createNotebookRow(label, key) {
            return `
                <div class="flex justify-between items-center bg-slate-900 px-2.5 py-1.5 rounded cursor-pointer hover:bg-slate-700 transition" onclick="toggleNb('${key}')">
                    <span>${label}</span>
                    <span id="nb-${key.replace(/\s+/g, '-')}" class="font-bold text-amber-400">❓</span>
                </div>
            `;
        }

        function switchNotebookTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.notebook-tab-content').forEach(c => c.classList.add('hidden'));

            document.getElementById(`tab-btn-${tabName}`).classList.add('active');
            document.getElementById(`notebook-tab-${tabName}`).classList.remove('hidden');
        }

        function toggleNb(key) {
            const cur = gameState.notebook[key];
            let nxt = (cur === "❓") ? "❌" : (cur === "❌") ? "✔️" : "❓";
            gameState.notebook[key] = nxt;
            const el = document.getElementById(`nb-${key.replace(/\s+/g, '-')}`);
            if (el) el.innerText = nxt;
        }

        function renderMyCards() {
            const container = document.getElementById('my-cards-container');
            container.innerHTML = "";
            const me = gameState.players.find(p => p.character === gameState.myPlayer.character);
            if (!me) return;

            me.cards.forEach(card => {
                container.innerHTML += `<span class="px-2 py-1 bg-amber-900/60 border border-amber-600 rounded text-xs text-amber-200">📜 ${card}</span>`;
                gameState.notebook[card] = "❌";
                const el = document.getElementById(`nb-${card.replace(/\s+/g, '-')}`);
                if (el) el.innerText = "❌";
            });
        }

        function updateLegend() {
            const legend = document.getElementById('players-legend');
            legend.innerHTML = "";

            gameState.players.forEach(p => {
                const isMe = gameState.myPlayer && p.character === gameState.myPlayer.character;
                const outTag = p.active ? '' : ' · eliminato';
                const playerTag = isMe ? `<span class="text-xs text-amber-400 font-bold ml-auto">(TU - ${p.name}${outTag})</span>` : `<span class="text-xs text-slate-500 ml-auto">${p.name}${outTag}</span>`;
                
                const row = document.createElement('div');
                row.className = `flex items-center gap-3 bg-slate-900 p-2 rounded-lg border ${isMe ? 'border-amber-500/50 bg-amber-950/20' : 'border-slate-800'} ${p.active ? '' : 'opacity-50'}`;

                const iconCanvas = document.createElement('canvas');
                iconCanvas.width = 32;
                iconCanvas.height = 32;
                const iconCtx = iconCanvas.getContext('2d');

                if (charsImageLoaded) {
                    const spriteW = charsSpriteImage.width / 3;
                    const spriteH = charsSpriteImage.height / 2;
                    const sx = p.spriteCol * spriteW;
                    const sy = p.spriteRow * spriteH;

                    iconCtx.beginPath();
                    iconCtx.arc(16, 16, 15, 0, 2 * Math.PI);
                    iconCtx.clip();
                    iconCtx.drawImage(charsSpriteImage, sx, sy, spriteW, spriteH, 1, 1, 30, 30);

                    iconCtx.beginPath();
                    iconCtx.arc(16, 16, 15, 0, 2 * Math.PI);
                    iconCtx.strokeStyle = p.color;
                    iconCtx.lineWidth = 2;
                    iconCtx.stroke();
                } else {
                    iconCtx.beginPath();
                    iconCtx.arc(16, 16, 14, 0, 2 * Math.PI);
                    iconCtx.fillStyle = p.color;
                    iconCtx.fill();
                    iconCtx.fillStyle = "#ffffff";
                    iconCtx.font = "bold 12px monospace";
                    iconCtx.textAlign = "center";
                    iconCtx.textBaseline = "middle";
                    iconCtx.fillText(p.initial, 16, 16);
                }

                const iconWrap = document.createElement('div');
                iconWrap.appendChild(iconCanvas);

                const nameSpan = document.createElement('span');
                nameSpan.className = "font-henny text-base text-amber-200 tracking-wide";
                nameSpan.innerText = `${p.character}`;

                row.appendChild(iconWrap);
                row.appendChild(nameSpan);
                row.insertAdjacentHTML('beforeend', playerTag);

                legend.appendChild(row);
            });
        }

        function logEvent(t) {
            const l = document.getElementById('game-log');
            l.innerHTML += `<p class="border-b border-slate-800 pb-0.5">${t}</p>`;
            l.scrollTop = l.scrollHeight;
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
